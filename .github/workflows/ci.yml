name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # tsc, not just vitest: vitest transpiles per file, so it cannot catch a
      # broken build. dist/ is committed and consumers install it directly, so
      # an uncompilable main silently strands every later commit (#5).
      - run: npx tsc --noEmit

      - run: npx vitest run

      # dist/ must match src/. A drifting build is exactly what #5 was.
      #
      # Built from scratch and staged before comparing: `git diff` ignores
      # untracked files and tsc does not clean outDir, so a NEW module would
      # land in dist/ untracked and a comparison of tracked files alone would
      # walk straight past it. dist/range.js in #6 was exactly such a file.
      - name: Check dist/ is up to date
        run: |
          rm -rf dist
          npm run build
          git add -A dist/
          if ! git diff --cached --exit-code --stat dist/; then
            echo "::error::dist/ is stale — run 'npm run build' and commit the result"
            exit 1
          fi
